name: Fetch Community Presets

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour at minute 0
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-presets:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to push commits back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Fetch Script
        run: python "thumb-maker ✅/update_community_presets.py"

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "thumb-maker ✅/community-presets.json"
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update community presets" && git push)
