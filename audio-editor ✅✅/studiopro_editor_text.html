        // --- Editing Tools (Split & Delete) ---
        
        function deleteSelectedClip() {
            const idsToDeleteRaw = State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0 ? [...State.multiSelectedClipIds] : (State.selectedClipId ? [State.selectedClipId] : []);
            const idsToDelete = idsToDeleteRaw.filter(id => {
                const c = State.clips.find(x => x.id === id);
                if (!c) return false;
                const t = State.tracks.find(tr => tr.id === c.trackId);
                return t && !t.locked;
            });
            if (idsToDelete.length === 0) return;
            
            idsToDelete.forEach(id => {
                const clipToDelete = State.clips.find(c => c.id === id);
                if (clipToDelete && clipToDelete.audioEl) {
                    clipToDelete.audioEl.pause();
                    clipToDelete.audioEl.removeAttribute('src');
                    if(clipToDelete.audioNodes) clipToDelete.audioNodes.source.disconnect();
                }
            });
            
            State.clips = State.clips.filter(c => !idsToDelete.includes(c.id));
            State.selectedClipId = null;
            State.multiSelectedClipIds = [];
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();
        }

        function splitClipAtPlayhead() {
            const time = State.currentTime;
            let targetClip = null;
            
            if (State.selectedClipId) {
                const c = State.clips.find(c => c.id === State.selectedClipId);
                const t = c ? State.tracks.find(tr => tr.id === c.trackId) : null;
                if (c && (!t || !t.locked) && time > c.start + 0.05 && time < c.start + c.duration - 0.05) {
                    targetClip = c;
                }
            }
            
            if (!targetClip) {
                const clipsUnderPlayhead = State.clips.filter(c => {
                    const t = State.tracks.find(tr => tr.id === c.trackId);
                    return (!t || !t.locked) && time > c.start + 0.05 && time < c.start + c.duration - 0.05;
                });
                if (clipsUnderPlayhead.length > 0) {
                    targetClip = clipsUnderPlayhead[clipsUnderPlayhead.length - 1]; 
                }
            }
            
            if (!targetClip) return;
            
            const leftDuration = time - targetClip.start;
            const rightDuration = targetClip.duration - leftDuration;
            
            const newAudioEl = targetClip.audioEl ? new Audio(targetClip.fileUrl) : null;
            if (newAudioEl) newAudioEl.crossOrigin = "anonymous";
            
            const newVideoEl = targetClip.videoEl ? document.createElement('video') : null;
            if (newVideoEl) {
                newVideoEl.src = targetClip.fileUrl;
                newVideoEl.crossOrigin = "anonymous";
                newVideoEl.muted = true;
                newVideoEl.load();
            }

            const newClip = {
                ...targetClip,
                id: 'c_' + Date.now() + Math.random().toString(36).substr(2, 5),
                start: time,
                sourceOffset: targetClip.sourceOffset + leftDuration,
                duration: rightDuration,
                audioEl: newAudioEl,
                videoEl: newVideoEl,
                effects: JSON.parse(JSON.stringify(targetClip.effects)), 
                audioNodes: null 
            };
            
            if (newClip.audioEl) buildAudioGraph(newClip);

            targetClip.duration = leftDuration;
            State.clips.push(newClip);
            State.selectedClipId = newClip.id; 
            
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();
        }

        function seekTimelinePlayhead(delta) {
            State.currentTime = Math.max(0, Math.min(State.currentTime + delta, State.duration));
            updatePlayhead();
            syncMediaElements();
            drawCanvas();
        }

        let keyboardNudgeTooltipTimeout = null;

        function nudgeSelectedClips(delta) {
            const idsToNudge = State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0 ? [...State.multiSelectedClipIds] : (State.selectedClipId ? [State.selectedClipId] : []);
            
            let movedAny = false;
            let primaryClip = null;
            idsToNudge.forEach(id => {
                const clip = State.clips.find(c => c.id === id);
                if (clip) {
                    const track = State.tracks.find(t => t.id === clip.trackId);
                    if (track && track.locked) return; // Skip locked tracks
                    
                    clip.start = Math.max(0, clip.start + delta);
                    movedAny = true;
                    if (id === State.selectedClipId) {
                        primaryClip = clip;
                    }
                }
            });
            
            if (movedAny) {
                // Adjust timeline duration if clips moved beyond current duration
                let maxEnd = 0;
                State.clips.forEach(c => {
                    if (c.start + c.duration > maxEnd) {
                        maxEnd = c.start + c.duration;
                    }
                });
                if (maxEnd > State.duration) {
                    State.duration = Math.ceil(maxEnd + 10);
                    updateTimelineWidth();
                }
                
                calcOverlaps();
                renderClips();
                syncMediaElements();
                drawCanvas();
                updatePropertiesPanel();

                // Dynamic tooltip feedback for keyboard nudging
                const tooltipClip = primaryClip || (idsToNudge.length > 0 ? State.clips.find(c => c.id === idsToNudge[0]) : null);
                if (tooltipClip) {
                    const clipEl = document.querySelector(`.clip[data-clip-id="${tooltipClip.id}"]`);
                    const dragTooltip = document.getElementById('dragTooltip');
                    if (clipEl && dragTooltip) {
                        const rect = clipEl.getBoundingClientRect();
                        dragTooltip.innerHTML = `Start: ${tooltipClip.start.toFixed(2)}s`;
                        
                        // Center tooltip horizontally above the clip
                        dragTooltip.style.left = `${rect.left + rect.width / 2}px`;
                        dragTooltip.style.top = `${rect.top - 28}px`;
                        dragTooltip.classList.remove('hidden');
                        
                        if (keyboardNudgeTooltipTimeout) {
                            clearTimeout(keyboardNudgeTooltipTimeout);
                        }
                        keyboardNudgeTooltipTimeout = setTimeout(() => {
                            dragTooltip.classList.add('hidden');

                    }
                }

        function calcOverlaps() {
            State.clips.forEach(c => c.overlapping = false);
            for(let i=0; i<State.clips.length; i++) {
                for(let j=i+1; j<State.clips.length; j++) {
                    const c1 = State.clips[i];
                    const c2 = State.clips[j];
                    if(c1.trackId === c2.trackId) {
                        if(c1.start < c2.start + c2.duration - 0.01 && c1.start + c1.duration > c2.start + 0.01) {
                            c1.overlapping = true;
                            c2.overlapping = true;
                        }
                    }
                }
            }
        }

        function updateTimelineWidth() {
            const totalWidth = State.duration * State.pixelsPerSecond;

            rulerWrapper.style.width = `${finalWidth}px`;

        window.reorderTrack = (draggedId, targetId) => {
            const dragIdx = State.tracks.findIndex(t => t.id === draggedId);
            const targetIdx = State.tracks.findIndex(t => t.id === targetId);
            if (dragIdx === -1 || targetIdx === -1) return;
            
            const dragTrack = State.tracks[dragIdx];
            const targetTrack = State.tracks[targetIdx];
            
            if (dragTrack.type === 'video' && targetTrack.type !== 'video') return;
            if (dragTrack.type === 'audio' && targetTrack.type !== 'audio') return;
            
            State.tracks.splice(dragIdx, 1);
            State.tracks.splice(targetIdx, 0, dragTrack);
            
            renderTrackHeaders();
            renderTracks();
            renderClips();
            drawCanvas();
        };
