name: Build and Deploy Animator Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-studio"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Cache Screenshots 🖼️
        uses: actions/cache@v4
        with:
          path: public/screenshots
          key: screenshots-${{ github.run_id }}
          restore-keys: |
            screenshots-

      - name: Install Dependencies 📦
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"

      - name: Generate Build 🔨
        run: npm run build
        env:
          CI: true

      - name: Copy static assets to dist 📁
        run: |
          mkdir -p dist/yt-experiments
          cp -r yt-experiments/. dist/yt-experiments/
          mkdir -p dist/_demos/previews
          if [ -d "_demos/previews" ]; then cp -r _demos/previews/. dist/_demos/previews/; fi
          if [ -f "_demos/gallery-data.json" ]; then cp _demos/gallery-data.json dist/_demos/gallery-data.json; fi
          mkdir -p dist/about
          if [ -d "about" ]; then cp -r about/. dist/about/; fi
          touch dist/.nojekyll

      - name: Upload Artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
