<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EigenSpace | Pattern Engine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>⚙️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Bebas Neue"', 'sans-serif'],
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            gray: '#231F20',
                            pink: '#F38BA3',
                            green: '#0BA95B',
                            yellow: '#F6AE2D',
                            cyan: '#00C2D1',
                            purple: '#8B5CF6',
                            orange: '#FF5722',
                            white: '#F9F4DA',
                            darkbg: '#121212'
                        }
                    },
                    boxShadow: {
                        'brutal-sm': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'brutal': '8px 8px 0px 0px rgba(0,0,0,1)',
                        'brutal-lg': '12px 12px 0px 0px rgba(0,0,0,1)',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        body {
            @apply bg-[#fdfcf9] dark:bg-[#121212] transition-colors duration-300;
            background-image: radial-gradient(circle, rgba(35, 31, 32, 0.15) 2px, transparent 2px);
            background-size: 32px 32px;
            overflow-x: hidden;
        }

        .dark body {
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1) 2px, transparent 2px);
        }

        .brutal-hover { transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .brutal-hover:active { transform: translate(4px, 4px) !important; box-shadow: 0px 0px 0px 0px rgba(0,0,0,1) !important; }

        input[type=range] {
            -webkit-appearance: none;
            @apply w-full bg-transparent border-[3px] border-black dark:border-white h-8 p-1;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            @apply h-6 w-6 bg-brand-cyan border-[3px] border-black dark:border-white cursor-pointer;
        }
        
        .katex-display {
            @apply font-mono bg-white dark:bg-black border-[3px] border-black dark:border-white shadow-brutal-sm p-4 overflow-x-auto text-lg sm:text-xl my-4 text-black dark:text-white;
        }
    </style>
</head>

<body class="text-brand-gray dark:text-brand-white antialiased min-h-screen flex flex-col selection:bg-brand-pink selection:text-black">

    <nav class="bg-brand-white dark:bg-brand-gray border-b-[3px] border-black dark:border-white w-full flex items-center justify-between p-3 sm:p-4 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black dark:bg-white text-white dark:text-black border-[3px] border-black dark:border-white shadow-brutal-sm flex items-center justify-center text-xl font-bold brutal-hover cursor-pointer">
                ⚙️
            </div>
            <div>
                <h1 class="font-display text-2xl sm:text-3xl leading-none tracking-wide text-black dark:text-white mt-1">PATTERN ENGINE</h1>
            </div>
        </div>
        <button onclick="toggleTheme()" class="bg-brand-yellow border-[3px] border-black p-2 shadow-brutal-sm brutal-hover">
            <i id="theme-icon" class="ph-bold ph-sun text-xl"></i>
        </button>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 flex flex-col lg:flex-row gap-8">
        
        <aside class="lg:w-1/4 flex flex-col gap-4">
            <div class="bg-black dark:bg-white text-white dark:text-black font-display text-3xl px-4 py-2 border-[3px] border-black dark:border-white shadow-brutal-sm -rotate-2 w-max mb-2">
                SELECT PATTERN
            </div>
            
            <button onclick="switchTab('bayes')" id="tab-bayes" class="pattern-tab bg-brand-orange border-[3px] border-black dark:border-white shadow-brutal p-4 text-left brutal-hover hover:-translate-y-1 transition-transform">
                <h3 class="font-bold text-2xl uppercase border-b-2 border-black/20 pb-1 mb-2">Bayes' Theorem</h3>
            </button>
            
            <button onclick="switchTab('eigen')" id="tab-eigen" class="pattern-tab bg-white dark:bg-gray-800 border-[3px] border-black dark:border-white p-4 text-left brutal-hover hover:-translate-y-1 transition-transform">
                <h3 class="font-bold text-2xl uppercase border-b-2 border-black/20 pb-1 mb-2">Eigenvalues</h3>
            </button>
            
            <button onclick="switchTab('expected')" id="tab-expected" class="pattern-tab bg-white dark:bg-gray-800 border-[3px] border-black dark:border-white p-4 text-left brutal-hover hover:-translate-y-1 transition-transform">
                <h3 class="font-bold text-2xl uppercase border-b-2 border-black/20 pb-1 mb-2">Expected Value</h3>
            </button>
        </aside>

        <section class="lg:w-3/4 flex flex-col gap-8">
            <div id="module-bayes" class="module-container block animate-fade-in">
                <!-- Content same as previous, dynamically updated via JS -->
                <div id="output-bayes" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
            <div id="module-eigen" class="module-container hidden animate-fade-in">
                <div id="output-eigen" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
            <div id="module-expected" class="module-container hidden animate-fade-in">
                <div id="output-expected" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </section>
    </main>

    <script>
        // --- STREAMING_CHUNK:Initializing interactivity... ---
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').className = isDark ? 'ph-bold ph-moon text-xl' : 'ph-bold ph-sun text-xl';
            renderAllMath();
        }

        function renderAllMath() {
            setTimeout(() => {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError : false
                });
            }, 50);
        }

        // --- STREAMING_CHUNK:Defining core logic for modules... ---
        function switchTab(tabId) {
            document.querySelectorAll('.module-container').forEach(el => el.classList.add('hidden'));
            document.getElementById(`module-${tabId}`).classList.remove('hidden');
            if(tabId === 'bayes') updateBayes();
            if(tabId === 'eigen') updateEigen();
            if(tabId === 'expected') updateExpected();
        }

        function updateBayes() {
            const out = document.getElementById('output-bayes');
            out.innerHTML = `
                <div class="bg-white dark:bg-gray-800 border-l-[6px] border-brand-orange p-6 shadow-brutal-sm">
                    <h3 class="font-bold text-xl mb-2">Step 1: Bayes Setup</h3>
                    <p class="text-sm">Identify P(D), P(T+|D), and P(T+|H).</p>
                    <div class="font-mono bg-gray-100 dark:bg-black p-3 border-2 border-black dark:border-white">
                        $P(D) = 0.01$ (Prior)
                    </div>
                </div>
            `;
            renderAllMath();
        }

        // Initialize theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = 'ph-bold ph-moon text-xl';
        }

        renderAllMath();
        switchTab('bayes');
    </script>
</body>
</html>
