        function generatePseudoPeaks(duration, peaksPerSecond) {
            const peaks = [];
            const count = Math.ceil(duration * peaksPerSecond);
            
            // Seeded LCG random generator for absolute determinism
            let r = 42;
            function nextRand() {
                r = (r * 1664525 + 1013904223) % 4294967296;
                return r / 4294967296;
            }

            let amplitude = 0.4;
            let targetAmp = 0.4;
            let steps = 0;

            for (let i = 0; i < count; i++) {
                if (steps <= 0) {
                    targetAmp = 0.05 + nextRand() * 0.75;
                    steps = Math.floor(10 + nextRand() * 40);
                }
                amplitude += (targetAmp - amplitude) * 0.15;
                steps--;

                const noise = (nextRand() - 0.5) * 0.15;
                let val = amplitude + noise;
                val = Math.max(0.01, Math.min(0.9, val));

                // Add periodic speech-like pauses
                const second = i / peaksPerSecond;
                const cycle = second % 8;
                if (cycle > 6.8 && cycle < 7.5) {
                    val *= 0.15;
                }

                peaks.push({ max: val, min: -val });
            }
            return peaks;
        }

        function drawCachedWaveform(canvas, clip, palette) {
            if (!clip.peaks || clip.peaks.length === 0) return;

            const scrollLeft = Math.floor(timelineScrollArea.scrollLeft);
            const viewportWidth = Math.ceil(timelineScrollArea.clientWidth);
            const scrollRight = scrollLeft + viewportWidth;

            // Calculate clip bounds relative to timeline scroll area (aligned to integer pixels to avoid render jitter)
            const clipStartPx = Math.floor(clip.start * State.pixelsPerSecond);
            const clipEndPx = Math.ceil((clip.start + clip.duration) * State.pixelsPerSecond);

            // Find visible segment
            const visibleStartPx = Math.max(clipStartPx, scrollLeft);
            const visibleEndPx = Math.min(clipEndPx, scrollRight);

            if (visibleStartPx < visibleEndPx) {
                const visibleWidth = visibleEndPx - visibleStartPx;
                const leftOffset = visibleStartPx - clipStartPx;

                // Position the canvas inside the absolute clip div to cover only the visible part
                canvas.style.position = 'absolute';
                canvas.style.left = `${leftOffset}px`;
                canvas.style.width = `${visibleWidth}px`;
                canvas.style.height = '100%';
                canvas.style.display = 'block';

                // Determine resolution based on device pixel ratio for ultimate sharpness
                const dpr = window.devicePixelRatio || 1;
                const track = State.tracks.find(t => t.id === clip.trackId);
                const trackHeight = track ? track.height : 60;
                
                // Set internal resolution
                const internalWidth = Math.ceil(visibleWidth * dpr);
                const internalHeight = Math.ceil(trackHeight * dpr);

                canvas.width = internalWidth;
                canvas.height = internalHeight;

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, internalWidth, internalHeight);

                const midY = (internalHeight / 2) + (5 * dpr); // vertical center adjustment
                const maxAmplitude = (internalHeight / 2) * 0.75;

                ctx.fillStyle = palette.wave;
                ctx.beginPath();
                ctx.moveTo(0, midY);

                // Map visible pixel coordinates to the peaks array index using constant factors to avoid sub-pixel scaling float jitter
                const startPeakIdx = (leftOffset / State.pixelsPerSecond + clip.sourceOffset) * clip.peaksPerSecond;
                const peaksPerPixel = clip.peaksPerSecond / (State.pixelsPerSecond * dpr);

                for (let x = 0; x < internalWidth; x++) {
                    let max = 0;
                    const peakStart = Math.floor(startPeakIdx + x * peaksPerPixel);
                    const peakEnd = Math.floor(startPeakIdx + (x + 1) * peaksPerPixel);
                    for (let p = peakStart; p < peakEnd && p < clip.peaks.length; p++) {
                        if (clip.peaks[p] && clip.peaks[p].max > max) max = clip.peaks[p].max;
                    }
                    ctx.lineTo(x, midY - (max * maxAmplitude));
                }

                for (let x = internalWidth - 1; x >= 0; x--) {
                    let min = 0;
                    const peakStart = Math.floor(startPeakIdx + x * peaksPerPixel);
                    const peakEnd = Math.floor(startPeakIdx + (x + 1) * peaksPerPixel);
                    for (let p = peakStart; p < peakEnd && p < clip.peaks.length; p++) {
                        if (clip.peaks[p] && clip.peaks[p].min < min) min = clip.peaks[p].min;
                    }
                    ctx.lineTo(x, midY - (min * maxAmplitude));
                }

                ctx.closePath();
                ctx.fill();
            } else {
                canvas.style.display = 'none';
            }
        }

        function drawAllWaveforms() {
            State.clips.forEach(clip => {
                if (clip.peaks && clip.peaks.length > 0) {
                    const clipEl = document.querySelector(`.clip[data-clip-id="${clip.id}"]`);
                    if (clipEl) {
                        const cvs = clipEl.querySelector('.waveform-canvas');
                        if (cvs) {
                            const palette = PALETTES[clip.colorIndex];
                            drawCachedWaveform(cvs, clip, palette);
                        }
                    }
                }
            });
        }

        function drawRuler() {
            const ctx = rulerCanvas.getContext('2d');
            const scrollLeft = timelineScrollArea.scrollLeft;
            const w = timelineScrollArea.clientWidth;
            const h = 28;
            
            if (rulerCanvas.width !== w) {
                rulerCanvas.style.width = w + 'px';
                rulerCanvas.width = w;
            }
            if (rulerCanvas.height !== h) rulerCanvas.height = h;
            
            const isDark = document.documentElement.classList.contains('dark');
            const isVscode = document.documentElement.classList.contains('vscode-dark');
            
            // Background
            ctx.fillStyle = isVscode ? '#1e1e1e' : (isDark ? '#1a1a1a' : '#ffffff');
            ctx.fillRect(0, 0, w, h);
            
            // Text color
            ctx.fillStyle = isVscode ? '#a3a3a3' : (isDark ? '#a3a3a3' : '#737373');
            ctx.font = '600 10px "JetBrains Mono"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            const secondsPer100px = 100 / State.pixelsPerSecond;
            let majorTickSecs = 1;
            if (secondsPer100px > 5) majorTickSecs = 10;
            else if (secondsPer100px > 2) majorTickSecs = 5;
            else if (secondsPer100px > 0.5) majorTickSecs = 1;
            else majorTickSecs = 0.5;

            const startTime = scrollLeft / State.pixelsPerSecond;
            const endTime = (scrollLeft + w) / State.pixelsPerSecond;
            const firstTick = Math.floor(startTime / majorTickSecs) * majorTickSecs;

            for (let sec = firstTick; sec <= endTime; sec += majorTickSecs) {
                if (sec < 0) continue;
                
                const x = (sec * State.pixelsPerSecond) - scrollLeft;
                
                ctx.beginPath(); ctx.moveTo(x, h - 6); ctx.lineTo(x, h);
                ctx.strokeStyle = isVscode ? '#525252' : (isDark ? '#525252' : '#d4d4d4');
                ctx.stroke();

                const mins = Math.floor(sec / 60);
                const secs = Math.floor(sec % 60).toString().padStart(2, '0');
                const text = majorTickSecs >= 1 ? `${mins}:${secs}` : `${secs}.${(sec%1)*10}`;
                ctx.fillText(text, x, 3);

                const minorDivs = majorTickSecs >= 1 ? 5 : 2;
                for(let j=1; j<minorDivs; j++) {
                    const mx = x + (j * majorTickSecs / minorDivs) * State.pixelsPerSecond;
                    if (mx >= 0 && mx <= w) {
                        ctx.beginPath(); ctx.moveTo(mx, h - 3); ctx.lineTo(mx, h);
                        ctx.strokeStyle = isVscode ? '#262626' : (isDark ? '#262626' : '#e5e5e5');
                        ctx.stroke();
                    }
                }
            }
        }

        // --- Canvas & Drag Logic ---
        function getCanvasMousePos(e) {
            const rect = canvasAspectWrapper.getBoundingClientRect();
            const canvas = document.getElementById('renderCanvas');
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function setupEventListeners() {
            let currentHoveredArea = 'timeline';
            if (propertiesSidebar) {
                propertiesSidebar.addEventListener('mouseenter', () => { currentHoveredArea = 'properties'; });
                propertiesSidebar.addEventListener('mouseleave', () => { currentHoveredArea = 'timeline'; });
            }
            if (timelineScrollArea) {
                timelineScrollArea.addEventListener('mouseenter', () => { currentHoveredArea = 'timeline'; });
            }

            function setZoom(newPPS) {
                newPPS = Math.max(10, Math.min(300, newPPS));
                if (newPPS === State.pixelsPerSecond) return;
                
                const centerTime = (timelineScrollArea.scrollLeft + timelineScrollArea.clientWidth / 2) / State.pixelsPerSecond;
                
                State.pixelsPerSecond = newPPS;
                updateTimelineWidth();
                renderClips();
                updatePlayhead();
                
                timelineScrollArea.scrollLeft = (centerTime * State.pixelsPerSecond) - (timelineScrollArea.clientWidth / 2);
                drawRuler(); 
            }

            btnZoomIn.addEventListener('click', () => setZoom(State.pixelsPerSecond + 25));
            btnZoomOut.addEventListener('click', () => setZoom(State.pixelsPerSecond - 25));

            btnPlay.addEventListener('click', togglePlay);
            
            // Global Keyboard Shortcuts (Space and K to play/pause)
            document.addEventListener('keydown', (e) => {
                // Ignore if user is typing in an input, textarea, or contenteditable element
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
                
                if (e.code === 'Space' || e.key.toLowerCase() === 'k') {
                    e.preventDefault(); // Prevent page scroll on Space
                    if (e.shiftKey && State.sidebarTab === 'audio_library' && State.selectedAudioLibId) {
                        toggleAudioLibPlayback();
                    } else {
                        togglePlay();
                    }
                }
            });
            btnStop.addEventListener('click', stopMedia);
            btnSplit.addEventListener('click', splitClipAtPlayhead);
            btnDelete.addEventListener('click', deleteSelectedClip);

            btnViewMenu.addEventListener('click', (e) => {
                e.stopPropagation();
                viewDropdown.classList.toggle('hidden');
                viewDropdown.classList.toggle('flex');
            });

            document.addEventListener('click', (e) => {
                if(!viewDropdown.classList.contains('hidden')){
                    if (!viewDropdown.contains(e.target) && e.target !== btnViewMenu && !btnViewMenu.contains(e.target)) {
                        viewDropdown.classList.add('hidden');
                        viewDropdown.classList.remove('flex');
                    }
                }
                if (importUrlDropdown && !importUrlDropdown.classList.contains('hidden')) {
                    if (e.target !== btnImportUrl && !btnImportUrl.contains(e.target) && e.target !== importUrlDropdown && !importUrlDropdown.contains(e.target)) {
                        importUrlDropdown.classList.add('hidden');
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                // Alt + 1/2/3 to switch inspector tabs
                if (e.altKey && (e.key === '1' || e.key === '2' || e.key === '3')) {
                    e.preventDefault();
                    if (e.key === '1') setSidebarTab('properties');
                    else if (e.key === '2') setSidebarTab('animations');
                    else if (e.key === '3') setSidebarTab('audio_library');
                    return;
                }

                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
                
                const k = e.key.toLowerCase();
                
                // WASD / Shift+WASD scrolling
                if (['w', 'a', 's', 'd'].includes(k) && !e.altKey && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    if (currentHoveredArea === 'properties') {
                        const container = document.getElementById('propertiesCardContainer') || document.getElementById('sidebarContent');
                        if (container) {
                            if (e.shiftKey) {
                                if (k === 'w') container.scrollTop = 0;
                                else if (k === 's') container.scrollTop = container.scrollHeight;
                                else if (k === 'a') container.scrollLeft = 0;
                                else if (k === 'd') container.scrollLeft = container.scrollWidth;
                            } else {
                                const scrollAmount = 60;
                                if (k === 'w') container.scrollBy({ top: -scrollAmount, behavior: 'auto' });
                                else if (k === 's') container.scrollBy({ top: scrollAmount, behavior: 'auto' });
                                else if (k === 'a') container.scrollBy({ left: -scrollAmount, behavior: 'auto' });
                                else if (k === 'd') container.scrollBy({ left: scrollAmount, behavior: 'auto' });
                            }
                        }
                    } else {
                        // timelineScrollArea
                        if (timelineScrollArea) {
                            if (e.shiftKey) {
                                if (k === 'w') timelineScrollArea.scrollTop = 0;
                                else if (k === 's') timelineScrollArea.scrollTop = timelineScrollArea.scrollHeight;
                                else if (k === 'a') timelineScrollArea.scrollLeft = 0;
                                else if (k === 'd') timelineScrollArea.scrollLeft = timelineScrollArea.scrollWidth;
                            } else {
                                const scrollAmount = 60;
                                if (k === 'w') timelineScrollArea.scrollBy({ top: -scrollAmount, behavior: 'auto' });
                                else if (k === 's') timelineScrollArea.scrollBy({ top: scrollAmount, behavior: 'auto' });
                                else if (k === 'a') timelineScrollArea.scrollBy({ left: -scrollAmount, behavior: 'auto' });
                                else if (k === 'd') timelineScrollArea.scrollBy({ left: scrollAmount, behavior: 'auto' });
                            }
                        }
                    }
                    return;
                }

                // Properties card jump shortcuts
                if (State.sidebarTab === 'properties') {
                    if (k === 't') { e.preventDefault(); scrollToPropertyCard('cardTransform'); return; }
                    else if (k === 'y') { e.preventDefault(); scrollToPropertyCard('cardTypography'); return; }
                    else if (k === 'g') { e.preventDefault(); scrollToPropertyCard('cardSpacing'); return; }
                    else if (k === 'o') { e.preventDefault(); scrollToPropertyCard('cardStroke'); return; }
                    else if (k === 'x') { e.preventDefault(); scrollToPropertyCard('cardExtrude'); return; }
                    else if (k === 'b') { e.preventDefault(); scrollToPropertyCard('cardOpacity'); return; }
                    else if (k === 'f') { 
                        e.preventDefault(); 
                        const targetId = document.getElementById('cardSystemFonts') ? 'cardSystemFonts' : 'cardGoogleFonts';
                        scrollToPropertyCard(targetId); 
                        return; 
                    }
                    
                    // Arrow keys scroll properties panel horizontally when in horizontal dock
                    const container = document.getElementById('propertiesCardContainer');
                    if (container) {
                        if (e.key === 'ArrowLeft' && !e.altKey && !e.ctrlKey && !e.shiftKey) {
                            e.preventDefault();
                            container.scrollBy({ left: -200, behavior: 'smooth' });
                            return;
                        } else if (e.key === 'ArrowRight' && !e.altKey && !e.ctrlKey && !e.shiftKey) {
                            e.preventDefault();
                            container.scrollBy({ left: 200, behavior: 'smooth' });
                            return;
                        }
                    }
                }
                
                if ((k === 's' && e.altKey) || (e.ctrlKey && k === 'b')) splitClipAtPlayhead();
                else if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedClip();
                else if (e.code === 'Space') { 
                    e.preventDefault(); 
                    if (e.shiftKey && State.sidebarTab === 'audio_library' && State.selectedAudioLibId) {
                        toggleAudioLibPlayback();
                    } else {
                        togglePlay(); 
                    }
                }
                else if (k === 'j' || k === 'l') {
                    e.preventDefault();
                    const isForward = (k === 'l');
                    const baseSeconds = e.ctrlKey ? 10 : 5;
                    const delta = isForward ? baseSeconds : -baseSeconds;
                    
                    const hasSelection = State.selectedClipId || (State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0);
                    const seekClip = hasSelection && (State.keyboardSeekClip || e.shiftKey || e.altKey);
                    
                    if (seekClip) {
                        nudgeSelectedClips(delta);
                    } else {
                        seekTimelinePlayhead(delta);
                    }
                }
                else if (e.key === ',' || e.key === '<' || e.key === '.' || e.key === '>') {
                    e.preventDefault();
                    const isForward = (e.key === '.' || e.key === '>');
                    const delta = isForward ? (1/30) : -(1/30);
                    
                    const hasSelection = State.selectedClipId || (State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0);
                    const seekClip = hasSelection && (State.keyboardSeekClip || e.altKey || (e.ctrlKey && e.shiftKey));
                    
                    if (seekClip) {
                        nudgeSelectedClips(delta);
                    } else {
                        seekTimelinePlayhead(delta);
                    }
                }
                else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    if (State.sidebarTab === 'audio_library') {
                        e.preventDefault();
                        if (State.audioLibrary.length > 0) {
                            let idx = State.audioLibrary.findIndex(a => a.id === State.selectedAudioLibId);
                            if (e.key === 'ArrowUp') {
                                idx = idx > 0 ? idx - 1 : State.audioLibrary.length - 1;
                            } else {
                                idx = idx < State.audioLibrary.length - 1 ? idx + 1 : 0;
                            }
                            selectAudioLibItem(State.audioLibrary[idx].id);
                        }
                    }
                }
                else if (e.key === 'Enter') {
                    if (State.sidebarTab === 'audio_library' && State.selectedAudioLibId) {
                        e.preventDefault();
                        addAudioLibToTimeline();
                    }
                }
                else if (k === '+' || k === '=') handleScaleUp();
                else if (k === '-' || k === '_') handleScaleDown();
                else if (k === 'r') handleRotate(e.shiftKey ? 30 : 15);
                else if (k === 'h') {
                    if (e.shiftKey) handleCenterH();
                    else handleFlipH();
                }
                else if (k === 'v') {
                    if (e.shiftKey) handleCenterV();
                    else handleFlipV();
                }
                else if (k === 'c') {
                    e.preventDefault();
                    toggleTimelineSeekAnywhere();
                }
                else if (e.key === '\\') handleToggleVis();
            });

            // Canvas Interaction Handlers
            canvasAspectWrapper.addEventListener('mousedown', (e) => {
                const pos = getCanvasMousePos(e);
                
                let activeVisualClips = State.clips.filter(c =>
                    !c.hidden &&
                    (c.type === 'video' || c.type === 'image' || c.type === 'text' || c.type === 'shape') &&
                    State.currentTime >= c.start &&
                    State.currentTime < c.start + c.duration
                );

                activeVisualClips.sort((a, b) => {
                    const idxA = State.tracks.findIndex(t => t.id === a.trackId);
                    const idxB = State.tracks.findIndex(t => t.id === b.trackId);
                    return idxA - idxB; 
                });

                let clickedClip = null;
                const canvas = document.getElementById('renderCanvas');

                for (let clip of activeVisualClips) {

                    let dw = canvas.width, dh = canvas.height;
                    
                    if (clip.type === 'text') {
                        const ctx = canvas.getContext('2d');
                        ctx.font = `${clip.effects.fontWeight} 100px "${clip.effects.fontFamily}"`;
                        const metrics = ctx.measureText(clip.text);
                        dw = metrics.width;
                        dh = 100;
                    } else if (clip.type === 'shape') {
                        dw = clip.effects.shapeWidth || 200;
                        dh = clip.effects.shapeHeight || 200;
                    } else {
                        let source = clip.type === 'image' ? clip.imageEl : clip.videoEl;
                        if (!source) continue;
                        const srcW = (source.naturalWidth || source.videoWidth) || 100;
                        const srcH = (source.naturalHeight || source.videoHeight) || 100;
                        
                        const cropEnable = clip.effects.cropEnable !== undefined ? clip.effects.cropEnable : true;
                        const cropLeft = cropEnable ? (clip.effects.cropLeft || 0) : 0;
                        const cropRight = cropEnable ? (clip.effects.cropRight || 0) : 0;
                        const cropTop = cropEnable ? (clip.effects.cropTop || 0) : 0;
                        const cropBottom = cropEnable ? (clip.effects.cropBottom || 0) : 0;
                        const frameZoom = cropEnable ? (clip.effects.frameZoom !== undefined ? clip.effects.frameZoom : 100) : 100;

                        const croppedLeftPx = srcW * (cropLeft / 100);
                        const croppedRightPx = srcW * (cropRight / 100);
                        const croppedTopPx = srcH * (cropTop / 100);
                        const croppedBottomPx = srcH * (cropBottom / 100);

                        const baseSw = Math.max(1, srcW - croppedLeftPx - croppedRightPx);
                        const baseSh = Math.max(1, srcH - croppedTopPx - croppedBottomPx);

                        const cropRatio = baseSw / baseSh;
                        const cRatio = canvas.width / canvas.height;
                        
                        if (!isNaN(cropRatio) && cropRatio > 0) {
                            if (cropRatio > cRatio) {
                                dw = canvas.width;
                                dh = canvas.width / cropRatio;
                            } else {
                                dh = canvas.height;
                                dw = canvas.height * cropRatio;
                            }
                        }
                        const zFrame = frameZoom / 100;
                        dw = dw * zFrame;
                        dh = dh * zFrame;
                    }

                    const scale = clip.effects.scale !== undefined ? clip.effects.scale : 1;
                    const rotate = clip.effects.rotate !== undefined ? clip.effects.rotate : 0;
                    const offsetX = clip.effects.offsetX || 0;
                    const offsetY = clip.effects.offsetY || 0;
                    const pX = (offsetX * canvas.width) / 100;
                    const pY = (offsetY * canvas.height) / 100;

                    const cx = canvas.width/2 + pX;
                    const cy = canvas.height/2 + pY;

                    let mx = pos.x - cx;
                    let my = pos.y - cy;

                    const rad = -rotate * Math.PI / 180;
                    const rmx = mx * Math.cos(rad) - my * Math.sin(rad);
                    const rmy = mx * Math.sin(rad) + my * Math.cos(rad);

                    const smx = rmx / scale;
                    const smy = rmy / scale;

                    if (smx >= -dw/2 && smx <= dw/2 && smy >= -dh/2 && smy <= dh/2) {
                        clickedClip = clip;
                        break;
                    }
                }

                if (clickedClip) {
                    if (e.ctrlKey || e.metaKey) {
                        if (State.multiSelectedClipIds.includes(clickedClip.id)) {
                            State.multiSelectedClipIds = State.multiSelectedClipIds.filter(id => id !== clickedClip.id);
                            if (State.selectedClipId === clickedClip.id) {
                                State.selectedClipId = State.multiSelectedClipIds.length > 0 ? State.multiSelectedClipIds[0] : null;
                            }
                        } else {
                            if (State.selectedClipId && !State.multiSelectedClipIds.includes(State.selectedClipId)) {
                                State.multiSelectedClipIds.push(State.selectedClipId);
                            }
                            State.multiSelectedClipIds.push(clickedClip.id);
                            State.selectedClipId = clickedClip.id;
                        }
                    } else {
                        if (!State.multiSelectedClipIds.includes(clickedClip.id)) {
                            State.multiSelectedClipIds = [clickedClip.id];
                            State.selectedClipId = clickedClip.id;
                        }
                    }

                    updatePropertiesPanel();
                    renderClips();
                    drawCanvas();
                    
                    canvasDrag.active = true;
                    canvasDrag.startX = pos.x;
                    canvasDrag.startY = pos.y;
                    
                    canvasDrag.initOffsets = {};
                    const idsToDrag = State.multiSelectedClipIds.length > 0 ? State.multiSelectedClipIds : [State.selectedClipId];
                    idsToDrag.forEach(id => {
                        const c = State.clips.find(clip => clip.id === id);
                        if (c) {
                            if (!c.effects) c.effects = {};
                            canvasDrag.initOffsets[id] = {
                                x: c.effects.offsetX || 0,
                                y: c.effects.offsetY || 0
                            };
                        }
                    });

                    document.getElementById('renderCanvas').classList.add('dragging');
                } else {
                    State.selectedClipId = null;
                    State.multiSelectedClipIds = [];
                    updatePropertiesPanel();
                    renderClips();
                    drawCanvas();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (canvasDrag.active) {
                    const pos = getCanvasMousePos(e);
                    const renderCanvas = document.getElementById('renderCanvas');
                    const dxPercent = ((pos.x - canvasDrag.startX) / renderCanvas.width) * 100;
                    const dyPercent = ((pos.y - canvasDrag.startY) / renderCanvas.height) * 100;

                    const idsToDrag = State.multiSelectedClipIds.length > 0 ? State.multiSelectedClipIds : (State.selectedClipId ? [State.selectedClipId] : []);
                    
                    idsToDrag.forEach(id => {
                        const clip = State.clips.find(c => c.id === id);
                        if (clip && canvasDrag.initOffsets && canvasDrag.initOffsets[id]) {
                            clip.effects.offsetX = canvasDrag.initOffsets[id].x + dxPercent;
                            clip.effects.offsetY = canvasDrag.initOffsets[id].y + dyPercent;
                        }
                    });
                    
                    if (idsToDrag.length > 0) {
                        drawCanvas();
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                canvasDrag.active = false;
                document.getElementById('renderCanvas').classList.remove('dragging');
            });


            // Timeline Ruler
            rulerCanvas.addEventListener('mousedown', (e) => {
                ensureAudioContext();
                
                const updateTimeFromMouse = (ev) => {
                    const rect = rulerCanvas.getBoundingClientRect();
                    const xInVisibleRuler = ev.clientX - rect.left;
                    const absoluteX = timelineScrollArea.scrollLeft + xInVisibleRuler;
                    State.currentTime = Math.max(0, Math.min(absoluteX / State.pixelsPerSecond, State.duration));
                    updatePlayhead();
                    syncMediaElements();
                    drawCanvas();
                };
                updateTimeFromMouse(e);
                
                const onMouseMove = (ev) => updateTimeFromMouse(ev);
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            // Synchronize vertical scroll of track headers
            timelineScrollArea.addEventListener('scroll', () => {
                document.getElementById('trackHeaders').style.transform = `translateY(-${timelineScrollArea.scrollTop}px)`;
                drawRuler();
                
                const hptc = document.getElementById('hoverPlayheadTimeContainer');
                if (hptc) {
                    hptc.style.top = `${timelineScrollArea.scrollTop + 4}px`;
                }
                drawAllWaveforms();
            });

            tracksContentContainer.addEventListener('mousedown', (e) => {
                if (State.timelineSeekAnywhere) {
                    if (e.target.closest('.clip')) {
                        handleMouseDown(e);
                        return;
                    }

                    ensureAudioContext();
                    const rect = tracksContentContainer.getBoundingClientRect();
                    const updateTimeFromMouse = (ev) => {
                        const xInVisibleContainer = ev.clientX - rect.left;
                        const absoluteX = timelineScrollArea.scrollLeft + xInVisibleContainer;
                        State.currentTime = Math.max(0, Math.min(absoluteX / State.pixelsPerSecond, State.duration));
                        updatePlayhead();
                        syncMediaElements();
                        drawCanvas();
                    };
                    
                    updateTimeFromMouse(e);
                    
                    const startX = e.clientX;
                    const startY = e.clientY;
                    
                    const onMouseMove = (ev) => {
                        const dist = Math.sqrt(Math.pow(ev.clientX - startX, 2) + Math.pow(ev.clientY - startY, 2));
                        if (dist > 6) {
                            document.removeEventListener('mousemove', onMouseMove);
                            
                            if (!ev.ctrlKey && !ev.metaKey) {
                                State.selectedClipId = null;
                                State.multiSelectedClipIds = [];
                                renderClips(); 
                                updatePropertiesPanel();
                                drawCanvas();
                            }
                            
                            State.drag.active = true;
                            State.drag.type = 'marquee';
                            State.drag.startX = startX;
                            State.drag.startY = startY;
                            
                            let marquee = document.getElementById('marqueeSelection');
                            if (!marquee) {
                                marquee = document.createElement('div');
                                marquee.id = 'marqueeSelection';
                                tracksContentContainer.appendChild(marquee);
                            }
                            marquee.style.left = `${startX - rect.left}px`;
                            marquee.style.top = `${startY - rect.top}px`;
                            marquee.style.width = '0px';
                            marquee.style.height = '0px';
                            marquee.style.display = 'block';
                        } else {
                            updateTimeFromMouse(ev);
                        }
                    };
                    
                    const onMouseUp = () => {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                } else {
                    if (!e.target.closest('.clip')) {
                        if (!e.ctrlKey && !e.metaKey) {
                            State.selectedClipId = null;
                            State.multiSelectedClipIds = [];
                            renderClips(); 
                            updatePropertiesPanel();
                            drawCanvas();
                        }
                        
                        const rect = tracksContentContainer.getBoundingClientRect();
                        State.drag.active = true;
                        State.drag.type = 'marquee';
                        State.drag.startX = e.clientX;
                        State.drag.startY = e.clientY;
                        
                        let marquee = document.getElementById('marqueeSelection');
                        if (!marquee) {
                            marquee = document.createElement('div');
                            marquee.id = 'marqueeSelection';
                            tracksContentContainer.appendChild(marquee);
                        }
                        marquee.style.left = `${e.clientX - rect.left}px`;
                        marquee.style.top = `${e.clientY - rect.top}px`;
                        marquee.style.width = '0px';
                        marquee.style.height = '0px';
                        marquee.style.display = 'block';
                    } else {
                        handleMouseDown(e);
                    }
                }
            });
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function setupHoverPlayhead() {
            const container = document.getElementById('timelineScrollArea');
            const hp = document.getElementById('hoverPlayhead');
            const hpt = document.getElementById('hoverPlayheadTime');
            const hptc = document.getElementById('hoverPlayheadTimeContainer');
            
            container.addEventListener('mousemove', (e) => {
                if (!State.hoverPlayheadEnabled || State.drag.active) {
                    hp.classList.add('hidden');
                    return;
                }
                const rect = container.getBoundingClientRect();
                const rawX = e.clientX - rect.left + container.scrollLeft;
                const time = rawX / State.pixelsPerSecond;
                if (time < 0) return;
                
                hp.style.left = `${rawX}px`;
                hpt.textContent = formatTime(time);
                if (hptc) {
                    hptc.style.top = `${container.scrollTop + 4}px`;
                }
                hp.classList.remove('hidden');
            });
            
            container.addEventListener('mouseleave', () => {
                hp.classList.add('hidden');
            });
        }

        function handleMouseDown(e) {
            const trimHandle = e.target.closest('.trim-handle');
            const clipEl = e.target.closest('.clip');
            if (!clipEl) return;

            const clipId = clipEl.dataset.clipId;
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            const track = State.tracks.find(t => t.id === clip.trackId);
            if (track && track.locked) return;

            const now = Date.now();
            if (State.lastClickClipId === clipId && (now - (State.lastClickTime || 0)) < 400) {
                if (clip.type === 'scene') {
                    enterScene(clipId);
                    State.lastClickTime = 0; // reset
                    return;
                }
            }
            State.lastClickTime = now;
            State.lastClickClipId = clipId;

            if (e.ctrlKey || e.metaKey) {
                if (State.multiSelectedClipIds.includes(clipId)) {
                    State.multiSelectedClipIds = State.multiSelectedClipIds.filter(id => id !== clipId);
                    if (State.selectedClipId === clipId) {
                        State.selectedClipId = State.multiSelectedClipIds.length > 0 ? State.multiSelectedClipIds[0] : null;
                    }
                } else {
                    State.multiSelectedClipIds.push(clipId);
                    State.selectedClipId = clipId;
                }
                renderClips();
                updatePropertiesPanel();
                drawCanvas();
            } else {
                if (!State.multiSelectedClipIds.includes(clipId)) {
                    State.multiSelectedClipIds = [clipId];
                    State.selectedClipId = clipId;
                    renderClips(); 
                    updatePropertiesPanel();
                    drawCanvas();
                } else if (State.selectedClipId !== clipId) {
                    State.selectedClipId = clipId;
                    renderClips();
                    updatePropertiesPanel();
                }
            }

            State.drag.active = true;
            State.drag.clipId = clipId;
            State.drag.initialStart = clip.start;
            State.drag.initialDuration = clip.duration;
            State.drag.initialSourceOffset = clip.sourceOffset;
            State.drag.initialTrackId = clip.trackId;
            State.drag.startX = e.clientX;
            State.drag.startY = e.clientY;

            State.drag.initialMulti = [];
            if (!trimHandle && State.multiSelectedClipIds.includes(clipId)) {
                State.multiSelectedClipIds.forEach(id => {
                    const c = State.clips.find(x => x.id === id);
                    if (c) State.drag.initialMulti.push({ id: c.id, start: c.start, trackId: c.trackId });
                });
            }

            if (trimHandle) {
                State.drag.type = trimHandle.dataset.action;
            } else {
                State.drag.type = 'move';
                if (State.multiSelectedClipIds.includes(clipId)) {
                    State.multiSelectedClipIds.forEach(id => {
                        const el = document.querySelector(`.clip[data-clip-id="${id}"]`);
                        if (el) el.classList.add('dragging');
                    });
                } else {
                    const freshClipEl = document.querySelector(`.clip[data-clip-id="${clip.id}"]`);
                    if(freshClipEl) freshClipEl.classList.add('dragging');
                }
            }
        }

        function handleMouseMove(e) {
            if (!State.drag.active) return;

            if (State.drag.type === 'marquee') {
                const rect = tracksContentContainer.getBoundingClientRect();
                const marquee = document.getElementById('marqueeSelection');
                if (marquee) {
                    const currentX = e.clientX;
                    const currentY = e.clientY;
                    
                    const left = Math.min(State.drag.startX, currentX) - rect.left;
                    const top = Math.min(State.drag.startY, currentY) - rect.top;
                    const width = Math.abs(currentX - State.drag.startX);
                    const height = Math.abs(currentY - State.drag.startY);
                    
                    marquee.style.left = `${left}px`;
                    marquee.style.top = `${top}px`;
                    marquee.style.width = `${width}px`;
                    marquee.style.height = `${height}px`;
                }
                return;
            }

            const dragTooltip = document.getElementById('dragTooltip');

            const clip = State.clips.find(c => c.id === State.drag.clipId);
            const clipEl = document.querySelector(`.clip[data-clip-id="${clip.id}"]`);
            if (!clip || !clipEl) return;

            const deltaX = e.clientX - State.drag.startX;
            let deltaTime = deltaX / State.pixelsPerSecond;

            const palette = PALETTES[clip.colorIndex];

            if (State.drag.type === 'move') {
                const rect = tracksContentContainer.getBoundingClientRect();
                const rawDeltaY = e.clientY - State.drag.startY;
                const isVerticalBreakout = Math.abs(rawDeltaY) > 20;

                const yPos = isVerticalBreakout ? e.clientY - rect.top : State.drag.startY - rect.top;
                const deltaY = isVerticalBreakout ? rawDeltaY : 0;
                
                let currentY = 0;
                let hoveredTrackId = null;
                for (const tr of State.tracks) {
                    if (yPos >= currentY && yPos < currentY + tr.height) { hoveredTrackId = tr.id; break; }
                    currentY += tr.height;
                }

                let typedDelta = 0;
                if (hoveredTrackId && hoveredTrackId !== clip.trackId) {
                    const tgtTrack = State.tracks.find(t=>t.id===hoveredTrackId);
                    if (tgtTrack) {
                        const isVisual = clip.type === 'video' || clip.type === 'image' || clip.type === 'text' || clip.type === 'scene' || clip.type === 'shape';
                        const isTgtVisual = tgtTrack.type === 'video';
                        const isAudio = clip.type === 'audio';
                        const isTgtAudio = tgtTrack.type === 'audio';
                        
                        if ((isVisual && isTgtVisual) || (isAudio && isTgtAudio)) {
                            const typedTracks = isVisual ? State.tracks.filter(t => t.type === 'video') : State.tracks.filter(t => t.type === 'audio');
                            const initialIndex = typedTracks.findIndex(t => t.id === State.drag.initialTrackId);
                            const newIndex = typedTracks.findIndex(t => t.id === hoveredTrackId);
                            if (initialIndex !== -1 && newIndex !== -1) {
                                typedDelta = newIndex - initialIndex;
                            }
                        }
                    }
                }

                const dragTooltip = document.getElementById('dragTooltip');

                // Remove existing drag-hover highlights
                tracksContentContainer.querySelectorAll('.track-lane').forEach(l => l.classList.remove('drag-hover'));

                if (State.drag.initialMulti && State.drag.initialMulti.length > 0) {
                    State.drag.initialMulti.forEach(mc => {
                        const mcClip = State.clips.find(c => c.id === mc.id);
                        const mcEl = document.querySelector(`.clip[data-clip-id="${mc.id}"]`);
                        if (mcClip && mcEl) {
                            mcClip.start = Math.max(0, mc.start + deltaTime);
                            mcEl.style.left = `${mcClip.start * State.pixelsPerSecond}px`;
                            mcEl.style.transform = `translateY(${deltaY}px)`;
                            mcEl.style.transition = 'none'; // Ensure instant visual feedback
                            
                            if (typedDelta !== 0) {
                                const mcIsVisual = mcClip.type === 'video' || mcClip.type === 'image' || mcClip.type === 'text' || mcClip.type === 'shape';
                                const mcTypedTracks = mcIsVisual ? State.tracks.filter(t => t.type === 'video') : State.tracks.filter(t => t.type === 'audio');
                                const mcInitialIndex = mcTypedTracks.findIndex(t => t.id === mc.trackId);
                                
                                if (mcInitialIndex !== -1) {
                                    let targetIndex = mcInitialIndex + typedDelta;
                                    targetIndex = Math.max(0, Math.min(targetIndex, mcTypedTracks.length - 1));
                                    
                                    const newTrack = mcTypedTracks[targetIndex];
                                    if (newTrack) {
                                        const lane = tracksContentContainer.querySelector(`.track-lane[data-track-id="${newTrack.id}"]`);
                                        if (lane) lane.classList.add('drag-hover');
                                        mc.targetTrackId = newTrack.id; // Store for mouseup
                                    }
                                }
                            } else {
                                mc.targetTrackId = mc.trackId; // No vertical change
                            }
                        }
                    });
                } else {
                    clip.start = Math.max(0, State.drag.initialStart + deltaTime);
                    clipEl.style.left = `${clip.start * State.pixelsPerSecond}px`;
                    clipEl.style.transform = `translateY(${deltaY}px)`;
                    clipEl.style.transition = 'none';

                    if (typedDelta !== 0) {
                        const lane = tracksContentContainer.querySelector(`.track-lane[data-track-id="${hoveredTrackId}"]`);
                        if (lane) lane.classList.add('drag-hover');
                        State.drag.targetTrackId = hoveredTrackId;
                    } else {
                        State.drag.targetTrackId = clip.trackId;
                    }
                }

                // Unified dynamic drag tooltip during move (for both single and multi-select drag)
                dragTooltip.innerHTML = `Start: ${clip.start.toFixed(2)}s`;
                const xVal = clip.start * State.pixelsPerSecond - timelineScrollArea.scrollLeft + timelineScrollArea.getBoundingClientRect().left;
                dragTooltip.style.left = `${xVal}px`;
                dragTooltip.style.top = `${e.clientY - 30}px`;
                dragTooltip.classList.remove('hidden');

            } else if (State.drag.type === 'trimLeft') {
                let newStart = State.drag.initialStart + deltaTime;
                let newSourceOffset = State.drag.initialSourceOffset + deltaTime;
                let newDuration = State.drag.initialDuration - deltaTime;

                if (newSourceOffset < 0) {
                    deltaTime = -State.drag.initialSourceOffset;
                    newStart = State.drag.initialStart + deltaTime;
                    newSourceOffset = 0;
                    newDuration = State.drag.initialDuration - deltaTime;
                }
                
                if (newDuration < 0.2) {
                    newDuration = 0.2;
                    newStart = (State.drag.initialStart + State.drag.initialDuration) - 0.2;
                    newSourceOffset = (State.drag.initialSourceOffset + State.drag.initialDuration) - 0.2;
                }

                clip.start = newStart;
                clip.sourceOffset = newSourceOffset;
                clip.duration = newDuration;
                
                clipEl.style.left = `${clip.start * State.pixelsPerSecond}px`;
                clipEl.style.width = `${clip.duration * State.pixelsPerSecond}px`;
                
                const dragTooltip = document.getElementById('dragTooltip');
                dragTooltip.innerHTML = `Start: ${clip.start.toFixed(2)}s`;
                const xVal = clip.start * State.pixelsPerSecond - timelineScrollArea.scrollLeft + timelineScrollArea.getBoundingClientRect().left;
                dragTooltip.style.left = `${xVal}px`;
                dragTooltip.style.top = `${e.clientY - 30}px`;
                dragTooltip.classList.remove('hidden');

                drawCachedWaveform(clipEl.querySelector('.waveform-canvas'), clip, palette);

            } else if (State.drag.type === 'trimRight') {
                let newDuration = State.drag.initialDuration + deltaTime;
                
                const maxAllowedDuration = clip.maxDuration - clip.sourceOffset;
                if (newDuration > maxAllowedDuration) newDuration = maxAllowedDuration;
                if (newDuration < 0.2) newDuration = 0.2;
                
                clip.duration = newDuration;
                clipEl.style.width = `${clip.duration * State.pixelsPerSecond}px`;
                
                const dragTooltip = document.getElementById('dragTooltip');
                dragTooltip.innerHTML = `End: ${(clip.start + clip.duration).toFixed(2)}s`;
                const xVal = (clip.start + clip.duration) * State.pixelsPerSecond - timelineScrollArea.scrollLeft + timelineScrollArea.getBoundingClientRect().left;
                dragTooltip.style.left = `${xVal}px`;
                dragTooltip.style.top = `${e.clientY - 30}px`;
                dragTooltip.classList.remove('hidden');

                drawCachedWaveform(clipEl.querySelector('.waveform-canvas'), clip, palette);
            }
            
            calcOverlaps();
            if(clip.overlapping) clipEl.classList.add('overlapping');
            else clipEl.classList.remove('overlapping');
            
            if (State.drag.type === 'move' || State.drag.type === 'trimLeft' || State.drag.type === 'trimRight') {
                drawCanvas();
            }
        }

        function handleMouseUp(e) {
            if (!State.drag.active) return;
            
            const dragTooltip = document.getElementById('dragTooltip');
            if (dragTooltip) dragTooltip.classList.add('hidden');
            
            if (State.drag.type === 'marquee') {
                const marquee = document.getElementById('marqueeSelection');
                if (marquee) {
                    const mRect = marquee.getBoundingClientRect();
                    const clipEls = tracksContentContainer.querySelectorAll('.clip');
                    
                    if (!e.ctrlKey && !e.metaKey) State.multiSelectedClipIds = [];
                    
                    clipEls.forEach(el => {
                        const cRect = el.getBoundingClientRect();
                        const intersect = !(
                            mRect.right < cRect.left || 
                            mRect.left > cRect.right || 
                            mRect.bottom < cRect.top || 
                            mRect.top > cRect.bottom
                        );
                        if (intersect) {
                            const cid = el.dataset.clipId;
                            if (!State.multiSelectedClipIds.includes(cid)) {
                                State.multiSelectedClipIds.push(cid);
                            }
                        }
                    });
                    
                    marquee.style.display = 'none';
                    marquee.style.width = '0px';
                    marquee.style.height = '0px';
                    
                    if (State.multiSelectedClipIds.length > 0) {
                        State.selectedClipId = State.multiSelectedClipIds[0];
                    }
                    
                    renderClips();
                    updatePropertiesPanel();
                    drawCanvas();
                }
            } else if (State.drag.type === 'move') {
                tracksContentContainer.querySelectorAll('.track-lane').forEach(l => l.classList.remove('drag-hover'));
                
                if (State.drag.initialMulti && State.drag.initialMulti.length > 0) {
                    State.drag.initialMulti.forEach(mc => {
                        const mcClip = State.clips.find(c => c.id === mc.id);
                        const mcEl = document.querySelector(`.clip[data-clip-id="${mc.id}"]`);
                        if (mcClip && mcEl) {
                            mcEl.classList.remove('dragging');
                            mcEl.style.transform = '';
                            if (mc.targetTrackId) mcClip.trackId = mc.targetTrackId;
                        }
                    });
                } else {
                    const clip = State.clips.find(c => c.id === State.drag.clipId);
                    const clipEl = document.querySelector(`.clip[data-clip-id="${State.drag.clipId}"]`);
                    if (clip && clipEl) {
                        clipEl.classList.remove('dragging');
                        clipEl.style.transform = '';
                        if (State.drag.targetTrackId) clip.trackId = State.drag.targetTrackId;
                    }
                }
            } else {
                const clipEl = document.querySelector(`.clip[data-clip-id="${State.drag.clipId}"]`);
                if (clipEl) clipEl.classList.remove('dragging');
            }
            
            State.drag.active = false;
            
            calcOverlaps();
            renderClips();
            syncMediaElements(); 
            drawCanvas();
        }

        // --- Audio Synchronization Engine ---
        let lastSyncTime = 0;
        function syncMediaElements() {
            if (!audioCtx) ensureAudioContext();
            
            const isJump = Math.abs(State.currentTime - lastSyncTime) > 0.2;
            lastSyncTime = State.currentTime;
            
            State.clips.forEach(clip => {
                const track = State.tracks.find(t => t.id === clip.trackId);
                const el = clip.audioEl || clip.videoEl;
                
                if (track && track.hidden) {
                    if (el && !el.paused) el.pause();
                    if (clip.sourceNode) {
                        clip.sourceNode.stop();
                        clip.sourceNode.disconnect();
                        clip.sourceNode = null;
                        clip.isPlaying = false;
                    }
                    return;
                }

                const shouldPlay = State.isPlaying && State.currentTime >= clip.start && State.currentTime <= clip.start + clip.duration;
                const isUpcoming = State.isPlaying && State.currentTime < clip.start && (clip.start - State.currentTime) < 0.5;
                
                if (clip.buffer) {
                    if (shouldPlay) {
                        if (!clip.isPlaying || isJump) {
                            if (clip.isPlaying && clip.sourceNode) {
                                try { clip.sourceNode.stop(); clip.sourceNode.disconnect(); } catch(e){}
                            }
                            clip.sourceNode = audioCtx.createBufferSource();
                            clip.sourceNode.buffer = clip.buffer;
                            if (clip.audioNodes && clip.audioNodes.noiseRed) {
                                clip.sourceNode.connect(clip.audioNodes.noiseRed);
                            } else {
                                clip.sourceNode.connect(audioCtx.destination);
                            }
                            const targetTime = clip.sourceOffset + (State.currentTime - clip.start);
                            clip.sourceNode.start(0, targetTime);
                            clip.isPlaying = true;
                            if (clip.audioNodes) applyAudioEffects(clip);
                        }
                    } else {
                        if (clip.isPlaying && clip.sourceNode) {
                            try {
                                clip.sourceNode.stop();
                                clip.sourceNode.disconnect();
                            } catch (e) {
                                // Ignore InvalidStateError if node already stopped naturally
                            }
                            clip.sourceNode = null;
                            clip.isPlaying = false;
                        }
                    }
                    return;
                }

                if (el) {
                    if (shouldPlay) {
                        if (clip.audioEl) applyAudioEffects(clip);
                        
                        const targetTime = clip.sourceOffset + (State.currentTime - clip.start);
                        
                        if (!el.seeking && Math.abs(el.currentTime - targetTime) > 0.25) {
                            el.currentTime = targetTime;
                        }
                        
                        if (el.paused) {
                            el.play().catch(e => console.warn("Auto-play prevented:", e));
                        }
                    } else {
                        if (!el.paused) {
                            el.pause();
                        }
                        if (isUpcoming) {
                            if (!el.seeking && Math.abs(el.currentTime - clip.sourceOffset) > 0.1) {
                                el.currentTime = clip.sourceOffset;
                            }
                        } else if (!State.isPlaying && State.currentTime >= clip.start && State.currentTime <= clip.start + clip.duration) {
                            const targetTime = clip.sourceOffset + (State.currentTime - clip.start);
                            if (!el.seeking && Math.abs(el.currentTime - targetTime) > 0.1) {
                                el.currentTime = targetTime;
                            }
                        }
                    }
                }
            });
        }

        function stopAllMedia() {
            State.clips.forEach(clip => {
                const el = clip.audioEl || clip.videoEl;
                if (el && !el.paused) {
                    el.pause();
                }
                if (clip.isPlaying && clip.sourceNode) {
                    try {
                        clip.sourceNode.stop();
                        clip.sourceNode.disconnect();
                    } catch (e) {
                        // Ignore
                    }
                    clip.sourceNode = null;
                    clip.isPlaying = false;
                }
            });
        }

        // --- Playback Engine ---

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 100).toString().padStart(2, '0');
            
            if (h > 0) {
                return `${h}:${m}:${s}.${ms}`;
            } else {
                return `${m}:${s}.${ms}`;
            }
        }

        function updatePlayhead() {
            // Round to integer to prevent sub-pixel desync with scrollLeft which causes jitter
            const px = Math.round(State.currentTime * State.pixelsPerSecond);
            playhead.style.transform = `translateX(${px}px)`;
            rulerPlayhead.style.transform = `translateX(${px}px)`;
            
            const timeStr = formatTime(State.currentTime);
            timeDisplay.textContent = timeStr;
            previewTimeText.textContent = timeStr;
            playheadTimePopup.textContent = timeStr;
            
            if (State.isPlaying) {
                const containerRect = timelineScrollArea.getBoundingClientRect();
                const relativeX = px - timelineScrollArea.scrollLeft;
                const threshold = Math.round(containerRect.width * 0.85);
                if (relativeX > threshold) {
                    timelineScrollArea.scrollLeft = px - threshold;
                }
            }
        }

        function togglePlay() {
            ensureAudioContext();

            if (State.currentTime >= State.duration) State.currentTime = 0;
            
            State.isPlaying = !State.isPlaying;
            State.lastRenderTime = performance.now();
            
            if (State.isPlaying) {
                wrapperPlay.classList.add('hidden');
                wrapperPlay.classList.remove('flex');
                wrapperPause.classList.remove('hidden');
                wrapperPause.classList.add('flex');
                
                btnPlay.classList.add('opacity-80');
                
                syncMediaElements();
                requestAnimationFrame(loop);
            } else {
                wrapperPause.classList.add('hidden');
                wrapperPause.classList.remove('flex');
                wrapperPlay.classList.remove('hidden');
                wrapperPlay.classList.add('flex');
                
                btnPlay.classList.remove('opacity-80');
                
                stopAllMedia();
            }
        }

        function stopMedia() {
            State.isPlaying = false;
            State.currentTime = 0;
            
            wrapperPause.classList.add('hidden');
            wrapperPause.classList.remove('flex');
            wrapperPlay.classList.remove('hidden');
            wrapperPlay.classList.add('flex');
            
            btnPlay.classList.remove('opacity-80');
            
            stopAllMedia();
            updatePlayhead();
            drawCanvas();
            timelineScrollArea.scrollLeft = 0;
        }

        function loop(now) {
            if (!State.isPlaying && !State.isExporting) return;

            const dt = (now - State.lastRenderTime) / 1000;
            State.lastRenderTime = now;
            State.currentTime += dt;

            if (State.currentTime >= State.duration) {
                if(!State.isExporting) stopMedia();
                return;
            }

            if(!State.isExporting) {
                syncMediaElements();
                drawCanvas();
            }
            
            updatePlayhead();
            requestAnimationFrame(loop);
        }

        // --- Export Engine ---

        function openExportModal() {
            document.getElementById('exportEndTime').value = State.duration.toFixed(1);
            document.getElementById('exportOverlay').classList.remove('hidden');
            document.getElementById('exportOverlay').classList.add('flex');
            document.getElementById('exportSettings').classList.remove('hidden');
            document.getElementById('exportProgress').classList.add('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportOverlay').classList.add('hidden');
            document.getElementById('exportOverlay').classList.remove('flex');
        }

        function cancelExport() {
            if (State.isExporting) {
                State.cancelExport = true;
            } else {
                State.exportResolution = 1920;
                closeExportModal();
            }
        }

        function submitExport() {
            const format = document.querySelector('input[name="exportFormat"]:checked').value;
            const scope = document.querySelector('input[name="exportScope"]:checked').value;
            State.exportResolution = parseInt(document.querySelector('input[name="exportResolution"]:checked').value);
            
            let startT = 0;
            let endT = State.duration;
            
            if (scope === 'custom') {
                startT = parseFloat(document.getElementById('exportStartTime').value) || 0;
                endT = parseFloat(document.getElementById('exportEndTime').value) || State.duration;
            }
            
            document.getElementById('exportSettings').classList.add('hidden');
            document.getElementById('exportProgress').classList.remove('hidden');
            document.getElementById('exportProgressBar').style.width = '0%';
            document.getElementById('exportProgressText').textContent = '0%';
            
            startExport(format, startT, endT);
        }

        function startExport(format, startTime, endTime) {
            if (State.isExporting) return;
            ensureAudioContext();
            
            State.isExporting = true;
            State.cancelExport = false;
            
            stopMedia();
            State.currentTime = startTime;
            
            let exportCanvas = null;
            let exportCtx = null;
            let exportW, exportH;
            
            let finalStream;
            let mimeType;
            let extension;

            if (format.includes('video') || format === 'gif') {
                const aspectStr = ASPECT_RATIOS[State.preview.aspectIndex].value;
                const [wRatio, hRatio] = aspectStr.split('/').map(Number);
                const baseRes = State.exportResolution || 1920;
                
                if (wRatio >= hRatio) {
                    exportW = baseRes;
                    exportH = baseRes * (hRatio / wRatio);
                } else {
                    exportH = baseRes;
                    exportW = baseRes * (wRatio / hRatio);
                }
                
                exportCanvas = document.createElement('canvas');
                exportCanvas.width = exportW;
                exportCanvas.height = exportH;
                exportCtx = exportCanvas.getContext('2d');
                
                const canvasStream = exportCanvas.captureStream(30);
                const audioTracks = State.masterStreamNode.stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    finalStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);
                } else {
                    finalStream = canvasStream;
                }
                
                if (format === 'video-mp4') {
                    mimeType = 'video/mp4;codecs="avc1, mp4a.40.2"'; // H.264 + AAC
                    extension = 'mp4';
                } else {
                    mimeType = 'video/webm;codecs=vp9,opus';
                    extension = format === 'gif' ? 'gif.webm' : 'webm';
                }
            } else {
                finalStream = State.masterStreamNode.stream;
                if (format === 'audio-wav') {
                    mimeType = 'audio/webm'; 
                    extension = 'wav';
                } else if (format === 'audio-mp3') {
                    mimeType = 'audio/webm';
                    extension = 'mp3';
                } else {
                    mimeType = 'audio/webm;codecs=opus'; 
                    extension = 'webm';
                }
            }

            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = format.includes('video') || format === 'gif' ? 'video/webm' : 'audio/webm';
            }

            const recorder = new MediaRecorder(finalStream, { mimeType: mimeType });
            const chunks = [];
            
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                if (!State.cancelExport) {
                    const blob = new Blob(chunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `StudioPro_Export.${extension}`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
                
                State.isExporting = false;
                State.exportResolution = 1920;
                if (State.speakerNode) State.speakerNode.gain.value = 1;
                closeExportModal();
                stopMedia();
            };

            State.lastRenderTime = performance.now();
            updatePlayhead();
            
            if (State.speakerNode) State.speakerNode.gain.value = 0;
            
            State.clips.forEach(clip => {
                const el = clip.audioEl || clip.videoEl;
                if (el && clip.start < endTime && (clip.start + clip.duration) > startTime) {
                    buildAudioGraph(clip);
                    applyAudioEffects(clip);
                    
                    const offset = Math.max(0, startTime - clip.start);
                    el.currentTime = clip.sourceOffset + offset;
                    
                    if (startTime >= clip.start) {
                        el.play().catch(e=>{});
                    }
                }
            });

            recorder.start();
            
            function exportLoop(now) {
                if (!State.isExporting) return;

                if (State.cancelExport) {
                    recorder.stop();
                    return;
                }

                const dt = (now - State.lastRenderTime) / 1000;
                State.lastRenderTime = now;
                State.currentTime += dt;

                State.clips.forEach(clip => {
                    const el = clip.audioEl || clip.videoEl;
                    if (el) {
                        // Start media if playhead reaches its start
                        if (State.currentTime >= clip.start && (State.currentTime - dt) < clip.start) {
                            el.currentTime = clip.sourceOffset;
                            el.play().catch(e=>{});
                        }
                        // Stop media if playhead passes it
                        if (State.currentTime > clip.start + clip.duration) {
                            if (!el.paused) el.pause();
                        }
                    }
                });

                if (exportCanvas && exportCtx) {
                    drawCanvas(exportCtx, exportW, exportH);
                } else {
                    drawCanvas();
                }

                const durationRange = endTime - startTime;
                const elapsed = State.currentTime - startTime;
                const progress = Math.min(100, Math.max(0, Math.round((elapsed / durationRange) * 100)));
                
                document.getElementById('exportProgressBar').style.width = `${progress}%`;
                document.getElementById('exportProgressText').textContent = `${progress}%`;

                if (State.currentTime >= endTime) {
                    recorder.stop();
                } else {
                    requestAnimationFrame(exportLoop);
                }
            }
            requestAnimationFrame(exportLoop);
        }


        updatePropertiesPanel();
        init();
    
        
    </script>
</body>
